name: Build Stocks.tipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache theos
        uses: actions/cache@v4
        with:
          path: /tmp/theos
          key: theos-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Setup theos
        run: |
          if [ ! -d /tmp/theos ]; then
            git clone --depth 1 https://github.com/theos/theos.git /tmp/theos
          fi
          echo "THEOS=/tmp/theos" >> $GITHUB_ENV

      - name: Download iPhoneOS 16.5 SDK
        run: |
          SDK_DIR="/tmp/theos/sdks"
          mkdir -p "$SDK_DIR"
          if [ ! -f "$SDK_DIR/iPhoneOS16.5.sdk.tar.xz" ]; then
            curl -L -o "$SDK_DIR/iPhoneOS16.5.sdk.tar.xz" \
              "https://github.com/theos/sdks/releases/download/master/iPhoneOS16.5.sdk.tar.xz"
          fi
          ls -la "$SDK_DIR/"

      - name: Build
        run: |
          export THEOS=/tmp/theos
          make clean 2>/dev/null || true
          make package FINAL_PACKAGE=1

      - name: Upload Stocks.tipa
        uses: actions/upload-artifact@v4
        with:
          name: Stocks-tipa
          path: packages/Stocks.tipa
          retention-days: 30
