name: Build Stocks.tipa

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare CJK Font
        run: |
          mkdir -p Resources
          # 优先用项目自带字体, 否则下载思源黑体 (~8MB)
          if [ -f "Resources/CJKFont.ttc" ] || [ -f "Resources/CJKFont.otf" ]; then
            echo "Font already in Resources/, skipping download"
            ls -lh Resources/
          else
            echo "Downloading SourceHanSansSC-Regular.otf..."
            curl -L --retry 5 --retry-delay 10 \
              -o Resources/CJKFont.otf \
              "https://github.com/adobe-fonts/source-han-sans/raw/release/OTF/SimplifiedChinese/SourceHanSansSC-Regular.otf"
            ls -lh Resources/
          fi

      - name: Install tools
        run: brew install xz || true
        # ★ 不要 brew install ldid！Theos 自带 ldid，brew 版的会覆盖 PATH 导致签名链路断裂

      - name: Setup theos
        run: |
          if [ ! -d /tmp/theos ]; then
            git clone --depth 1 --recursive https://github.com/theos/theos.git /tmp/theos
          fi
          echo "THEOS=/tmp/theos" >> $GITHUB_ENV

      - name: Cache SDK
        uses: actions/cache@v4
        with:
          path: /tmp/theos/sdks
          key: iphoneos-16.5-sdk

      - name: Download iPhoneOS 16.5 SDK
        run: |
          SDK_DIR="/tmp/theos/sdks"
          mkdir -p "$SDK_DIR"
          if [ ! -f "$SDK_DIR/iPhoneOS16.5.sdk.tar.xz" ]; then
            curl -L --retry 5 --retry-delay 5 \
              -o "$SDK_DIR/iPhoneOS16.5.sdk.tar.xz" \
              "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          fi
          if [ ! -d "$SDK_DIR/iPhoneOS16.5.sdk" ]; then
            tar -xJf "$SDK_DIR/iPhoneOS16.5.sdk.tar.xz" -C "$SDK_DIR/"
          fi
          ls -la "$SDK_DIR/"

      - name: Build
        run: |
          export THEOS=/tmp/theos
          make clean 2>/dev/null || true
          make package FINAL_PACKAGE=1

      - name: Verify entitlements embedded in binary
        run: |
          echo "=== Checking embedded entitlements ==="
          THEOS_LDID=$(ls /tmp/theos/bin/ldid* 2>/dev/null | head -1)
          if [ -z "$THEOS_LDID" ]; then THEOS_LDID=$(which ldid); fi
          echo "Using ldid: $THEOS_LDID"
          # 解压 tipa 取出二进制
          mkdir -p /tmp/verify_ent
          cd /tmp/verify_ent
          unzip -o packages/Stocks.tipa Payload/Stocks.app/Stocks >/dev/null 2>&1
          echo "Entitlements in Stocks binary:"
          "$THEOS_LDID" -e Payload/Stocks.app/Stocks 2>/dev/null || codesign -d --entitlements - Payload/Stocks.app/Stocks 2>/dev/null || echo "WARNING: Cannot read entitlements"
          echo "=== Verify complete ==="
          ls -la Payload/Stocks.app/Stocks

      - name: Upload Stocks.tipa
        uses: actions/upload-artifact@v4
        with:
          name: Stocks-tipa-${{ github.sha }}
          path: packages/Stocks.tipa
          if-no-files-found: error
